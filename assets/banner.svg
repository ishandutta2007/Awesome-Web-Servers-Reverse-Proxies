<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="proxyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="edgeAura" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>

    <style>
      .pulse-slow {
        animation: pulseGlow 5s ease-in-out infinite alternate;
      }
      .float-1 {
        animation: floatItem 4s ease-in-out infinite alternate;
      }
      .float-2 {
        animation: floatItem 5s ease-in-out 1s infinite alternate;
      }
      .float-3 {
        animation: floatItem 4.5s ease-in-out 2s infinite alternate;
      }
      .packet-flow {
        stroke-dasharray: 8 16;
        animation: flowAnimation 2.5s linear infinite;
      }
      .packet-flow-rev {
        stroke-dasharray: 6 14;
        animation: flowAnimationRev 3s linear infinite;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes floatItem {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowAnimationRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 48; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />

  <!-- Dynamic Glowing Auras (Background) -->
  <circle cx="600" cy="200" r="300" fill="url(#proxyAura)" class="pulse-slow" />
  <circle cx="1020" cy="90" r="220" fill="url(#edgeAura)" class="pulse-slow" />

  <!-- Animated Reverse Proxy Network Flow Architecture (Mid-ground) -->
  <g opacity="0.45">
    <!-- Clients to Ingress Gateway Lines -->
    <path d="M 80 120 C 220 120, 260 210, 420 210" fill="none" stroke="#0284c7" stroke-width="2" class="packet-flow" />
    <path d="M 80 210 C 200 210, 280 210, 420 210" fill="none" stroke="#38bdf8" stroke-width="2.5" class="packet-flow" />
    <path d="M 80 300 C 220 300, 260 210, 420 210" fill="none" stroke="#0284c7" stroke-width="2" class="packet-flow" />

    <!-- Ingress Gateway to Upstream Backends Lines -->
    <path d="M 780 210 C 900 210, 960 120, 1120 120" fill="none" stroke="#38bdf8" stroke-width="2" class="packet-flow-rev" />
    <path d="M 780 210 C 900 210, 980 210, 1120 210" fill="none" stroke="#818cf8" stroke-width="2.5" class="packet-flow-rev" />
    <path d="M 780 210 C 900 210, 960 300, 1120 300" fill="none" stroke="#38bdf8" stroke-width="2" class="packet-flow-rev" />

    <!-- Network Nodes -->
    <circle cx="80" cy="120" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="80" cy="210" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="80" cy="300" r="6" fill="#38bdf8" filter="url(#glow)" />

    <circle cx="1120" cy="120" r="6" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1120" cy="210" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1120" cy="300" r="6" fill="#818cf8" filter="url(#glow)" />
  </g>

  <!-- Floating Dynamic Tech Tags (Mid-ground, kept clear of center title) -->
  <g class="float-1">
    <rect x="80" y="42" width="130" height="30" rx="15" fill="url(#pillGrad)" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)" />
    <text x="145" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ HTTP/3 &amp; QUIC</text>
  </g>

  <g class="float-2">
    <rect x="980" y="42" width="140" height="30" rx="15" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#shadow)" />
    <text x="1050" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">🛡️ TLS Termination</text>
  </g>

  <g class="float-3">
    <rect x="70" y="348" width="150" height="30" rx="15" fill="url(#pillGrad)" stroke="#0ea5e9" stroke-width="1.2" filter="url(#shadow)" />
    <text x="145" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">🔄 Load Balancing</text>
  </g>

  <g class="float-1">
    <rect x="980" y="348" width="140" height="30" rx="15" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)" />
    <text x="1050" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">🌐 Edge CDN Cache</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Subtitle, and Feature Badges (Always Sharp & Visible) -->
  <g filter="url(#shadow)">
    <!-- Top Category Indicator Badge -->
    <rect x="475" y="55" width="250" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2" />
    <text x="600" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="-0.5">
      Awesome Web Servers &amp; Reverse Proxies
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">
      High-Performance HTTP Servers, Reverse Proxies, Load Balancers, API Gateways &amp; Edge Delivery
    </text>

    <!-- Divider Bar -->
    <rect x="520" y="222" width="160" height="3" rx="1.5" fill="#38bdf8" opacity="0.8" />

    <!-- Description Details -->
    <text x="600" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Architected for Platform Engineers, SREs, DevOps Architects &amp; Web Infrastructure Builders
    </text>

    <!-- Bottom Highlights Row in Foreground -->
    <g transform="translate(195, 290)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="185" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="18" r="5" fill="#22c55e" />
        <text x="105" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Ultra Low Latency</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(205, 0)">
        <rect width="195" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="18" r="5" fill="#38bdf8" />
        <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🛡️ Automated TLS / SSL</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="195" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="18" r="5" fill="#818cf8" />
        <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">☸️ Kubernetes &amp; Ingress</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(635, 0)">
        <rect width="175" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
        <circle cx="22" cy="18" r="5" fill="#f59e0b" />
        <text x="100" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⭐ Production Tested</text>
      </g>
    </g>
  </g>
</svg>
